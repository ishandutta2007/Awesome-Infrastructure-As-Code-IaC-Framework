<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.7; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .bg-orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .flow-line { stroke-dasharray: 10, 15; animation: dashFlow 20s linear infinite; }
    .floating-card { animation: floatCard 6s ease-in-out infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #e2e8f0; font-size: 13px; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
  </g>

  <!-- Dynamic Glowing Orbs in Background (Non-blocking) -->
  <circle class="bg-orb1" cx="150" cy="90" r="140" fill="#6366f1" filter="url(#softGlow)"/>
  <circle class="bg-orb2" cx="1050" cy="260" r="160" fill="#a855f7" filter="url(#softGlow)"/>

  <!-- Dynamic Flow Paths (Background Architecture Graphics) -->
  <path class="flow-line" d="M 100 280 Q 300 320 500 270 T 900 290 T 1150 220" fill="none" stroke="url(#accentGrad1)" stroke-width="2" stroke-opacity="0.4"/>
  <path class="flow-line" d="M 50 80 Q 400 20 700 80 T 1100 50" fill="none" stroke="url(#accentGrad2)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Floating Decorative Nodes (Right Side Graphic Accent) -->
  <g class="floating-card" opacity="0.85">
    <!-- Node 1: Terraform -->
    <rect x="920" y="60" width="180" height="50" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="960" y="90" class="badge-text">⚡ Terraform / OpenTofu</text>
    <circle cx="940" cy="85" r="5" fill="#38bdf8"/>

    <!-- Node 2: Pulumi / CDK -->
    <rect x="860" y="135" width="190" height="50" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="900" y="165" class="badge-text">🚀 Pulumi &amp; AWS CDK</text>
    <circle cx="880" cy="160" r="5" fill="#a855f7"/>

    <!-- Node 3: Kubernetes / Crossplane -->
    <rect x="930" y="210" width="200" height="50" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="970" y="240" class="badge-text">☸️ Crossplane &amp; Kubernetes</text>
    <circle cx="950" cy="235" r="5" fill="#10b981"/>
  </g>

  <!-- FOREGROUND TEXT AND CONTENT (Strictly Layered On Top) -->
  
  <!-- Category Pill Badge -->
  <g transform="translate(80, 55)">
    <rect width="320" height="32" rx="16" fill="url(#accentGrad1)" opacity="0.2"/>
    <rect width="320" height="32" rx="16" fill="none" stroke="url(#accentGrad1)" stroke-width="1"/>
    <text x="16" y="21" class="badge-text" fill="#f1f5f9">🛠️ CURATED IAC ECOSYSTEM &amp; PLATFORMS</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="145" class="title-text" font-size="44" filter="url(#glow)">
    Awesome Infrastructure As Code
  </text>
  <text x="80" y="195" class="title-text" font-size="34" fill="url(#accentGrad1)">
    (IaC) Frameworks &amp; Tools ⚡
  </text>

  <!-- Subtitle / Description -->
  <text x="80" y="245" class="subtitle-text" font-size="18">
    Declarative Provisioning • Programming-Language SDKs • Kubernetes Control Planes
  </text>
  <text x="80" y="275" class="subtitle-text" font-size="15" fill="#64748b">
    Comprehensive directory of SaaS Platforms, Open-Source Engines, &amp; Orchestration Tools
  </text>

  <!-- Bottom Accent Line -->
  <rect x="80" y="305" width="1040" height="4" rx="2" fill="url(#accentGrad1)"/>
</svg>
